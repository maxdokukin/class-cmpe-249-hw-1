[project]
name = "hw1"
version = "0.1.0"
description = "CMPE249 HW1: zero-shot 2D detection under domain shift, with a prompt-tuning agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics",
    "transformers",
    "pycocotools",
    "opencv-python-headless",
    "numpy",
    "pillow",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "anthropic",
]

[project.optional-dependencies]
vm = ["polars[rtcompat]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hw1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# ultralytics pulls GUI opencv-python; headless provides the same cv2 without X11 libs
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
markers = ["slow: parity tests that run full models (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
